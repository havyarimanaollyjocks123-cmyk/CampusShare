{% extends 'base.html' %}
{% block title %}Signaler une ressource - CampusShare{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 600px;">
    <h2>Signaler un document</h2>
    <p style="margin-bottom: 1rem; color: var(--text-light);">
        Vous êtes sur le point de signaler : <strong>{{ ressource.titre }}</strong>
    </p>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Motif du signalement</label>
            <select name="motif" class="form-control" required>
                <option value="ERRONE">Contenu erroné</option>
                <option value="HORS_SUJET">Hors sujet</option>
                <option value="DOUBLON">Doublon (déjà publié)</option>
                <option value="ILLICITE">Contenu illicite</option>
                <option value="AUTRE">Autre</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Commentaire (optionnel)</label>
            <textarea name="commentaire" class="form-control" rows="3" placeholder="Expliquez brièvement pourquoi..."></textarea>
        </div>
        
        <button type="submit" class="btn btn-danger btn-block">🚨 Envoyer le signalement</button>
        <a href="{% url 'catalogue' %}" class="btn btn-secondary btn-block" style="margin-top: 10px;">Annuler</a>
    </form>
</div>
{% endblock %}
